<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طمأنينة | Tamanina</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --card-bg: #FFFFFF;
      --text: #0F172A;
      --text-secondary: #475569;
      --primary: #0D9488;
      --primary-hover: #0F766E;
      --primary-light: #CCFBF1;
      --warning: #D97706;
      --danger: #DC2626;
      --border: #E2E8F0;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
      --touch-target: 48px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, 'Cairo', system-ui, sans-serif;
    }

    body {
      width: 400px;
      max-height: 600px;
      overflow-y: auto;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      user-select: none;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 20px;
      box-shadow: 0 2px 6px rgba(13, 148, 136, 0.3);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 800;
      color: var(--text);
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .lang-btn {
      min-height: 36px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 2px solid var(--primary);
      background: transparent;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn:hover, .lang-btn:focus {
      background: var(--primary-light);
    }

    .main-toggle-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      box-shadow: var(--shadow);
      border: 2px solid var(--border);
      margin-bottom: 16px;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .toggle-label {
      font-size: 15px;
      font-weight: 700;
    }

    .toggle-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.4;
      margin-top: 2px;
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 32px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #CBD5E1;
      transition: .3s;
      border-radius: 32px;
      border: 2px solid #94A3B8;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 24px;
      width: 24px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    html[dir="rtl"] .slider:before { right: 2px; left: auto; }

    input:checked + .slider {
      background-color: var(--primary);
      border-color: var(--primary-hover);
    }

    input:checked + .slider:before { transform: translateX(26px); }
    html[dir="rtl"] input:checked + .slider:before { transform: translateX(-26px); }

    /* Issues Section */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .issue-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .issue-card {
      background: var(--card-bg);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .issue-card:hover, .issue-card:focus {
      border-color: var(--primary);
      background: var(--primary-light);
      outline: none;
    }

    .issue-header {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .issue-icon {
      font-size: 18px;
    }

    .issue-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    .issue-snippet {
      font-size: 12px;
      color: var(--text-secondary);
      background: #F1F5F9;
      padding: 6px 10px;
      border-radius: 6px;
      font-family: monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .issue-action-hint {
      font-size: 12px;
      color: var(--primary);
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .no-issues-card {
      background: var(--card-bg);
      border: 2px dashed #10B981;
      color: #065F46;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
    }

    .btn-action {
      width: 100%;
      min-height: 44px;
      background: var(--primary);
      color: white;
      border: 2px solid var(--primary-hover);
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text);
      border: 2px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="brand-icon">ط</div>
      <div>
        <div class="brand-title" id="txt-app-title">طمأنينة</div>
        <div class="brand-sub" id="txt-app-sub">مساعد التصفح الآمن والمريح</div>
      </div>
    </div>
    <button class="lang-btn" id="btn-lang-toggle">English</button>
  </div>

  <!-- Safe Mode Switch Card -->
  <div class="main-toggle-card">
    <div class="toggle-row">
      <div>
        <div class="toggle-label" id="txt-safe-mode-label">نمط الأمان البسيط</div>
        <div class="toggle-desc" id="txt-safe-mode-desc">تكبير الخطوط، إخفاء الإعلانات، وتوضيح الأزرار.</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="chk-safe-mode">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Detected Issues Section -->
  <div class="section-header">
    <div class="section-title">
      <span>🔎</span>
      <span id="txt-issues-title">المخاطر المكتشفة على هذه الصفحة</span>
    </div>
  </div>

  <div id="issue-list-container" class="issue-list">
    <!-- Issues rendered dynamically by popup.js -->
  </div>

  <!-- Action Buttons -->
  <button class="btn-action" id="btn-scan-page">
    <span>🔍</span>
    <span id="txt-btn-scan">إعادة فحص الصفحة الآن</span>
  </button>

  <button class="btn-action btn-secondary" id="btn-toggle-reader">
    <span>📖</span>
    <span id="txt-btn-reader">تفعيل دليل القراءة الأفقي</span>
  </button>

  <script src="popup.js"></script>
</body>
</html>
